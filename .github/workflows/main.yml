name: Build VAULT 999 iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Project Files & App Source
        run: |
          mkdir -p Sources Resources

          cat << 'EOF' > project.yml
          name: VAULT999
          options:
            bundleIdPrefix: com.vault999
            deploymentTarget:
              iOS: "15.0"
          targets:
            VAULT999:
              type: application
              platform: iOS
              sources:
                - path: Sources
              resources:
                - path: Resources/index.html
              info:
                path: Info.plist
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.vault999.app
                  MARKETING_VERSION: "1.0.0"
                  CURRENT_PROJECT_VERSION: "1"
                  SWIFT_VERSION: "5.0"
                  GENERATE_INFOPLIST_FILE: NO
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
          EOF

          cat << 'EOF' > Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>VAULT999</string>
            <key>CFBundleIdentifier</key>
            <string>com.vault999.app</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>VAULT 999</string>
            <key>CFBundleDisplayName</key>
            <string>VAULT 999</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UIBackgroundModes</key>
            <array>
              <string>audio</string>
            </array>
            <key>NSAppTransportSecurity</key>
            <dict>
              <key>NSAllowsArbitraryLoads</key>
              <true/>
            </dict>
            <key>UILaunchScreen</key>
            <dict>
              <key>UIColorName</key>
              <string></string>
            </dict>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
              <string>arm64</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
            </array>
          </dict>
          </plist>
          EOF

          cat << 'EOF' > Sources/AppDelegate.swift
          import UIKit
          import WebKit
          import AVFoundation

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(
                  _ application: UIApplication,
                  didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?
              ) -> Bool {
                  try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .default)
                  try? AVAudioSession.sharedInstance().setActive(true)

                  let window = UIWindow(frame: UIScreen.main.bounds)
                  window.backgroundColor = UIColor(red: 12/255, green: 12/255, blue: 14/255, alpha: 1)
                  window.rootViewController = VaultViewController()
                  window.makeKeyAndVisible()
                  self.window = window
                  return true
              }
          }

          class VaultViewController: UIViewController {
              private var webView: WKWebView!

              override var preferredStatusBarStyle: UIStatusBarStyle { .lightContent }

              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = UIColor(red: 12/255, green: 12/255, blue: 14/255, alpha: 1)

                  let config = WKWebViewConfiguration()
                  config.allowsInlineMediaPlayback = true
                  config.mediaTypesRequiringUserActionForPlayback = []

                  webView = WKWebView(frame: view.bounds, configuration: config)
                  webView.autoresizingMask = [.flexibleWidth, .flexibleHeight]
                  webView.isOpaque = false
                  webView.backgroundColor = view.backgroundColor
                  webView.scrollView.backgroundColor = view.backgroundColor
                  webView.scrollView.contentInsetAdjustmentBehavior = .never
                  view.addSubview(webView)

                  if let url = Bundle.main.url(forResource: "index", withExtension: "html") {
                      webView.loadFileURL(url, allowingReadAccessTo: url.deletingLastPathComponent())
                  }
              }
          }
          EOF

          cat << 'EOF' > Resources/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
            <meta name="apple-mobile-web-app-capable" content="yes" />
            <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
            <title>VAULT 999</title>
            <style>
              * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
              body {
                background: #0c0c0e;
                color: #f4f4f5;
                font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
                min-height: 100vh;
                padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 110px);
              }
              .header {
                display: flex; align-items: center; justify-content: space-between;
                padding-bottom: 16px; border-bottom: 1px solid #27272a; margin-bottom: 20px;
              }
              .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; letter-spacing: 0.04em; }
              .badge-999 {
                background: #7c3aed; color: #fff; font-size: 12px; font-weight: 800;
                padding: 4px 8px; border-radius: 6px;
              }
              .card {
                background: #141417; border: 1px solid #27272a; border-radius: 16px;
                padding: 18px; margin-bottom: 16px;
              }
              .cover-row { display: flex; gap: 16px; align-items: center; }
              .cover {
                width: 96px; height: 96px; border-radius: 12px; background: #1e1b4b;
                border: 1px solid #3f3f46; overflow: hidden; flex-shrink: 0;
                display: flex; align-items: center; justify-content: center;
                font-weight: 900; font-size: 24px; color: #a78bfa;
              }
              .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
              .pill {
                display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase;
                letter-spacing: 0.06em; padding: 3px 8px; border-radius: 999px;
                background: rgba(124, 58, 237, 0.18); color: #c4b5fd; margin-bottom: 6px;
              }
              h1 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
              .sub { font-size: 13px; color: #a1a1aa; }
              .meta-grid {
                display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
                margin-top: 16px; padding-top: 14px; border-top: 1px solid #27272a; font-size: 12px;
              }
              .meta-label { color: #71717a; display: block; margin-bottom: 2px; }
              .meta-val { color: #e4e4e7; font-weight: 600; }
              .btn-play {
                width: 100%; margin-top: 16px; padding: 14px; border: none; border-radius: 12px;
                background: #7c3aed; color: #fff; font-size: 15px; font-weight: 700;
                cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
              }
              .btn-play:active { opacity: 0.85; }
              .player-bar {
                position: fixed; left: 0; right: 0; bottom: 0;
                background: rgba(20, 20, 23, 0.96); backdrop-filter: blur(16px);
                border-top: 1px solid #27272a;
                padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px);
              }
              .progress-row { display: flex; align-items: center; gap: 10px; font-size: 11px; color: #a1a1aa; margin-bottom: 8px; }
              input[type="range"] { flex: 1; accent-color: #7c3aed; height: 4px; }
              .controls { display: flex; align-items: center; justify-content: space-between; }
              .status-text { font-size: 12px; color: #a1a1aa; }
            </style>
          </head>
          <body>
            <div class="header">
              <div class="brand"><span class="badge-999">999</span> VAULT 999</div>
              <span style="font-size:11px;color:#71717a;font-weight:600;">CURATED ARCHIVE</span>
            </div>

            <div class="card">
              <div class="cover-row">
                <div class="cover" id="coverBox">999</div>
                <div>
                  <span class="pill">UNRELEASED · #4504</span>
                  <h1>Floating</h1>
                  <div class="sub">Juice WRLD · Floating (Scheming)</div>
                </div>
              </div>

              <div class="meta-grid">
                <div><span class="meta-label">Era</span><span class="meta-val">Death Race For Love</span></div>
                <div><span class="meta-label">Producers</span><span class="meta-val">Max Lord, PVLACE, Michelangelo</span></div>
                <div><span class="meta-label">Recorded</span><span class="meta-val">Feb 27, 2019 · Berlin</span></div>
                <div><span class="meta-label">Leaked</span><span class="meta-val">Oct 9, 2026</span></div>
              </div>

              <button class="btn-play" id="mainPlayBtn" onclick="togglePlay()">▶ Play Floating</button>
            </div>

            <div class="player-bar">
              <div class="progress-row">
                <span id="curTime">0:00</span>
                <input type="range" id="seekBar" min="0" max="100" value="0" oninput="seekAudio(this.value)" />
                <span id="durTime">0:00</span>
              </div>
              <div class="controls">
                <div>
                  <div style="font-size:13px;font-weight:700;">Juice WRLD - Floating - Unreleased</div>
                  <div class="status-text" id="statusText">Ready · Vault ID #4504</div>
                </div>
                <button onclick="togglePlay()" id="barPlayBtn" style="background:#7c3aed;color:#fff;border:none;border-radius:999px;width:40px;height:40px;font-weight:700;font-size:15px;">▶</button>
              </div>
            </div>

            <audio id="audio" preload="none" playsinline webkit-playsinline></audio>

            <script>
              const STREAM_URL = "https://juicewrldvault.com/api/download-song?id=4504&tags=info%2Cart";
              const audio = document.getElementById("audio");
              const mainPlayBtn = document.getElementById("mainPlayBtn");
              const barPlayBtn = document.getElementById("barPlayBtn");
              const statusText = document.getElementById("statusText");
              const seekBar = document.getElementById("seekBar");
              const curTime = document.getElementById("curTime");
              const durTime = document.getElementById("durTime");
              let loaded = false;

              function fmt(s) {
                if (!isFinite(s) || s < 0) return "0:00";
                const m = Math.floor(s / 60);
                const sec = Math.floor(s % 60);
                return m + ":" + (sec < 10 ? "0" : "") + sec;
              }

              async function togglePlay() {
                try {
                  if (!loaded) {
                    statusText.textContent = "Connecting to Vault stream...";
                    audio.src = STREAM_URL;
                    loaded = true;
                  }
                  if (audio.paused) {
                    await audio.play();
                  } else {
                    audio.pause();
                  }
                } catch (err) {
                  statusText.textContent = "Stream error — retrying via blob...";
                  try {
                    const res = await fetch(STREAM_URL);
                    const blob = await res.blob();
                    audio.src = URL.createObjectURL(blob);
                    await audio.play();
                  } catch (e2) {
                    statusText.textContent = "Playback failed: " + e2.message;
                  }
                }
              }

              function seekAudio(val) {
                if (isFinite(audio.duration) && audio.duration > 0) {
                  audio.currentTime = (val / 100) * audio.duration;
                }
              }

              audio.addEventListener("play", () => {
                mainPlayBtn.textContent = "⏸ Pause Floating";
                barPlayBtn.textContent = "⏸";
                statusText.textContent = "Playing · Death Race For Love Era";
                if ("mediaSession" in navigator) {
                  navigator.mediaSession.metadata = new MediaMetadata({
                    title: "Floating (Unreleased)",
                    artist: "Juice WRLD",
                    album: "VAULT 999"
                  });
                }
              });

              audio.addEventListener("pause", () => {
                mainPlayBtn.textContent = "▶ Play Floating";
                barPlayBtn.textContent = "▶";
                statusText.textContent = "Paused";
              });

              audio.addEventListener("timeupdate", () => {
                curTime.textContent = fmt(audio.currentTime);
                if (isFinite(audio.duration) && audio.duration > 0) {
                  durTime.textContent = fmt(audio.duration);
                  seekBar.value = (audio.currentTime / audio.duration) * 100;
                }
              });
            </script>
          </body>
          </html>
          EOF

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned iOS App
        run: |
          xcodebuild \
            -project VAULT999.xcodeproj \
            -scheme VAULT999 \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package VAULT999.ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/VAULT999.app Payload/
          zip -r VAULT999.ipa Payload

      - name: Upload VAULT999.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VAULT999-IPA
          path: VAULT999.ipa
